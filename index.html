<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CDIFFUSION Aveyron</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: rail de navigation à gauche (bas d'écran sur mobile), contenu en bandes. Ardoise verte, vert prairie, safran en signal. */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --surface-2:#E5ECE6; --ink:#12201A; --ink-2:#47574E; --ink-3:#6C7C72;
  --line:#D3DCD5; --accent:#0E7A51; --accent-ink:#FFFFFF; --accent-soft:#D7EEE2;
  --sun:#9A6A00; --sun-solid:#E3A500; --sun-ink:#1B1400; --sun-soft:#FBEFCB;
  --info:#255F9E; --info-soft:#DCE8F6; --crit:#B0352A; --crit-soft:#F7DDD9;
  --shadow:0 1px 2px rgba(18,32,26,.06),0 8px 24px -12px rgba(18,32,26,.18);
  --hero:#0C3F2B; --hero-ink:#EAF5EE; --hero-dim:#A9C7B6; --gold:#F2C14E;
  --display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B120E; --surface:#131D17; --surface-2:#1A2820; --ink:#E6EFE8; --ink-2:#A2B4A8; --ink-3:#74887B;
  --line:#26372D; --accent:#3FD08F; --accent-ink:#06150D; --accent-soft:#143325;
  --sun:#F0B93A; --sun-solid:#E9B124; --sun-ink:#1B1400; --sun-soft:#33280C;
  --info:#7DB2EE; --info-soft:#13273D; --crit:#F08678; --crit-soft:#3A1914;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B120E; --surface:#131D17; --surface-2:#1A2820; --ink:#E6EFE8; --ink-2:#A2B4A8; --ink-3:#74887B;
  --line:#26372D; --accent:#3FD08F; --accent-ink:#06150D; --accent-soft:#143325;
  --sun:#F0B93A; --sun-solid:#E9B124; --sun-ink:#1B1400; --sun-soft:#33280C;
  --info:#7DB2EE; --info-soft:#13273D; --crit:#F08678; --crit-soft:#3A1914;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:15px;height:15px}.i.lg{width:22px;height:22px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}

.shell{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.main{min-width:0;padding-bottom:104px}
@media(min-width:960px){
  .shell{grid-template-columns:232px minmax(0,1fr);column-gap:32px}
  .side{display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;padding-block:22px}
  .main{padding-bottom:56px}
}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 16px var(--display);letter-spacing:-.02em;position:relative}
.logo::after{content:"";position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--sun-solid);border:2px solid var(--bg)}
.brand b{font:700 17px var(--display);letter-spacing:-.01em;display:block}
.brand small{font-size:11.5px;color:var(--ink-3);display:block;line-height:1.25}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border:0;background:none;border-radius:9px;color:var(--ink-2);font-weight:550;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav button[aria-current="page"] .i{color:var(--accent)}
.side .foot{margin-top:auto;font-size:12px;color:var(--ink-3);display:grid;gap:8px}
.demo-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--sun);background:var(--sun-soft);border-radius:99px;padding:3px 10px;width:max-content}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.top .brand{display:flex}
@media(min-width:960px){.top .brand{display:none}.top{padding-block:22px 14px}}
.top h1{font-size:clamp(21px,2.6vw,30px);font-weight:700}
.top .ttl{min-width:0;display:flex;flex-direction:column;gap:2px}
.top .ttl .eyebrow{display:none}
@media(min-width:960px){.top .ttl .eyebrow{display:block}}
@media(max-width:959px){.top .ttl h1{display:none}}
.tools{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:10px;font-weight:600;font-size:13.5px;line-height:1.2;min-height:38px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:0;width:38px}
.btn[aria-disabled="true"]{opacity:.55}
.btn kbd{font:500 11px var(--mono);background:var(--surface-2);border-radius:5px;padding:1px 6px;color:var(--ink-2)}
.hide-sm{display:none}@media(min-width:720px){.hide-sm{display:inline}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--ink-3);border-radius:9px}
.tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media(min-width:960px){.tabbar{display:none}}
.minibar{position:fixed;left:0;right:0;z-index:39;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px));display:none}
.minibar.on{display:block}
@media(min-width:960px){.minibar.on{display:none}}
.minibar div{background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--shadow)}
.minibar b{font:700 17px var(--display)}
.minibar button{border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;border-radius:8px;padding:6px 12px;font-size:12.5px}

/* panels */
.view{display:grid;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel.flat{background:transparent;border-style:dashed}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h2,.ph h3{font-size:17px;font-weight:650}
.ph p{font-size:13px;color:var(--ink-3);margin-top:2px}
.grid2{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1040px){.grid2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:650;white-space:nowrap}
.b-ok{background:var(--accent-soft);color:var(--accent)}.b-info{background:var(--info-soft);color:var(--info)}
.b-warn{background:var(--sun-soft);color:var(--sun)}.b-mute{background:var(--surface-2);color:var(--ink-2)}.b-crit{background:var(--crit-soft);color:var(--crit)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

/* overview */
.hero{position:relative;overflow:hidden;border-radius:18px;background:var(--hero);color:var(--hero-ink);padding:clamp(22px,4vw,42px);display:grid;gap:24px;align-items:center;
  background-image:repeating-radial-gradient(ellipse 60% 80% at 90% 14%,transparent 0 26px,rgba(234,245,238,.07) 26px 27px),repeating-radial-gradient(ellipse 50% 60% at 4% 110%,transparent 0 30px,rgba(234,245,238,.05) 30px 31px)}
@media(min-width:900px){.hero{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.hero h2{font-size:clamp(28px,4.2vw,46px);font-weight:750;max-width:18ch;line-height:1.04;color:var(--hero-ink)}
.hero h2 em{font-style:normal;color:var(--gold)}
.hero .sub{max-width:50ch;color:var(--hero-dim);margin-top:14px}
.hero .live{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:var(--hero-ink);background:rgba(234,245,238,.12);padding:4px 12px;border-radius:99px;margin-bottom:16px}
.hero .pulse{background:var(--gold);box-shadow:0 0 0 0 var(--gold)}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn.sun{background:var(--gold);border-color:var(--gold);color:#1B1400}
.btn.onhero{background:transparent;border-color:rgba(234,245,238,.4);color:var(--hero-ink)}
.btn.onhero:hover{border-color:var(--hero-ink)}
.hm{width:100%;max-width:400px;justify-self:center;min-width:0}
.hm svg{display:block;width:100%;height:auto}
.hm text{font:600 20px var(--sans);fill:var(--hero-ink);paint-order:stroke;stroke:var(--hero);stroke-width:5px;stroke-linejoin:round}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.kpi:nth-child(2n){border-right:0}
@media(min-width:900px){.kpi{border-bottom:0}.kpi:nth-child(2n){border-right:1px solid var(--line)}.kpi:last-child{border-right:0}}
.kpi:nth-last-child(-n+2){border-bottom:0}
.kpi .l{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;gap:6px;align-items:center}
.kpi .v{font:700 clamp(24px,3vw,34px) var(--display);margin-top:6px;letter-spacing:-.02em}
.kpi .v small{font:500 12.5px var(--sans);color:var(--ink-3);letter-spacing:0;margin-left:5px}
.kpi .t{font-size:12px;color:var(--accent);font-weight:600;margin-top:2px}
.mission{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:13px 0;border-top:1px solid var(--line);align-items:center}
.mission:first-of-type{border-top:0;padding-top:0}
.mission b{font-weight:650}.mission .s{font-size:12.5px;color:var(--ink-3)}
.mission .r{text-align:right;display:grid;gap:6px;justify-items:end;width:110px}
.mission .bar{width:100%}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font:500 11.5px var(--mono)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar-r{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.chart .bar-r.last{fill:var(--accent)}
.chart text.val{fill:var(--ink);font-weight:500}
.evrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.evrow:first-child{border-top:0;padding-top:0}
.date-chip{width:46px;flex:none;text-align:center;border:1px solid var(--line);border-radius:10px;padding:4px 0;line-height:1.1}
.date-chip b{display:block;font:700 18px var(--display)}.date-chip span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}

/* devis */
.devis{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1040px){.devis{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}.devis .sticky{position:sticky;top:96px}}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-size:12px;font-weight:650;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:9px}
.form{display:grid;gap:22px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:11px;text-align:left;min-width:0}
.chip b{display:block;font-weight:650;font-size:13.5px}.chip small{color:var(--ink-3);font-size:11.5px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip[aria-pressed="true"] b{color:var(--accent)}
.chip .i{color:var(--accent);opacity:0}.chip[aria-pressed="true"] .i{opacity:1}
.qty{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.field{display:grid;gap:5px}
.field label,.field .lab{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.in{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:38px}
.in:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);min-height:100%}
.opt b{display:block;font-size:13.5px;font-weight:650}.opt small{color:var(--ink-3);font-size:11.5px}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft)}
.opt input:checked+span b{color:var(--accent)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.mapbox{position:relative;border-radius:12px;background:var(--surface-2);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mp-out{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.mp-grid{stroke:var(--line);stroke-width:.6;stroke-dasharray:2 5;opacity:.7}
.mp-river{fill:none;stroke:var(--info);stroke-width:1.4;opacity:.35}
.mp-route{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 6;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.mp-halo{fill:var(--accent);opacity:.12}
.mp-node circle.c{fill:var(--surface);stroke:var(--ink-3);stroke-width:1.5;transition:fill .2s,stroke .2s}
.mp-node.on circle.c{fill:var(--accent);stroke:var(--accent)}
.mp-node text{font:600 12px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
.mp-node.off text{fill:var(--ink-3)}
.mp-node{cursor:pointer}
.mp-node:focus-visible{outline:none}.mp-node:focus-visible circle.c{stroke:var(--sun-solid);stroke-width:3}
.mp-base rect{fill:var(--ink)}.mp-base text{font:500 13px var(--mono);fill:var(--ink-2);paint-order:stroke;stroke:var(--surface-2);stroke-width:3px}
.total{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.total .big{font:750 clamp(34px,5vw,48px) var(--display);letter-spacing:-.03em;line-height:1}
.total .big small{font:500 14px var(--sans);color:var(--ink-3);letter-spacing:0;margin-left:6px}
table{border-collapse:collapse;width:100%}
.lines td{padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.lines td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lines tr.sum td{font-weight:700}
.lines td small{color:var(--ink-3)}
.lines .neg td:last-child{color:var(--accent)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-block:14px}
.st{border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-width:0}
.st .l{font-size:11.5px;color:var(--ink-3);font-weight:600}.st .v{font:700 20px var(--display);margin-top:2px}
.st .v small{font:500 11.5px var(--sans);color:var(--ink-3);margin-left:3px}
.scroll-x{overflow-x:auto}
.alloc td,.alloc th{padding:6px 8px 6px 0;font-size:13px;border-top:1px solid var(--line);text-align:left}
.alloc th{font-size:11.5px;color:var(--ink-3);font-weight:600;border-top:0}
.alloc td:last-child,.alloc th:last-child{text-align:right;padding-right:0}
details{border:1px solid var(--line);border-radius:11px;padding:10px 14px}
summary{cursor:pointer;font-weight:600;font-size:13.5px}
details p,details li{font-size:13px;color:var(--ink-2)}details ul{margin:8px 0 0;padding-left:18px;display:grid;gap:3px}

/* tournée */
.tour-sel{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gps{display:grid;gap:22px}
@media(min-width:1040px){.gps{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}}
.gmap{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.gmap svg{display:block;width:100%;height:auto}
.g-st{stroke:var(--line);stroke-width:7;fill:none;stroke-linecap:round}
.g-st.s2{stroke-width:4}
.g-blk{fill:var(--surface);opacity:.55}
.g-river{fill:none;stroke:var(--info);stroke-width:10;opacity:.22;stroke-linecap:round}
.g-todo{fill:none;stroke:var(--ink-3);stroke-width:2.5;stroke-dasharray:6 7;opacity:.8}
.g-done{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.g-park{fill:var(--accent-soft);opacity:.75}
.g-stop circle{fill:var(--surface);stroke:var(--ink-3);stroke-width:2}
.g-stop.ok circle{fill:var(--accent);stroke:var(--accent)}
.g-stop text{font:700 11px var(--mono);fill:var(--ink-2);text-anchor:middle}
.g-stop.ok text{fill:var(--accent-ink)}
.stops{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-top:14px}

/* ---------- pricing ---------- */
function alloc(q){
  var sel=CITIES.filter(function(c){return q.cities.indexOf(c.id)>-1});
  var tot=sel.reduce(function(s,c){return s+c.pop},0);
  var rows=sel.map(function(c){return {c:c,n:Math.round(q.qty*c.pop/tot/100)*100}});
  rows.sort(function(a,b){return b.c.pop-a.c.pop});
  var diff=q.qty-rows.reduce(function(s,r){return s+r.n},0); rows[0].n+=diff; return rows;
}
function quote(q){
  var f=FORMATS.filter(function(x){return x.id===q.format})[0], m=MODES.filter(function(x){return x.id===q.mode})[0], p=PAPERS.filter(function(x){return x.id===q.paper})[0], d=DELAYS.filter(function(x){return x.id===q.delay})[0];
  var sel=CITIES.filter(function(c){return q.cities.indexOf(c.id)>-1});
  var deploy=sel.reduce(function(s,c){return s+c.base},0);
  var print=q.qty/1000*f.print*p.m, dist=q.qty/1000*m.dist;
  var dr=q.qty>=35000?.08:q.qty>=20000?.05:q.qty>=10000?.02:0;
  var disc=(print+dist)*dr;
  var pre=deploy+print+dist-disc, rush=pre*(d.m-1), ht=pre+rush, tva=ht*.2;
  var co2=sel.reduce(function(s,c){return s+c.co2},0)*(q.qty/5000)*p.co2;
  var couriers=Math.min(4,Math.ceil(q.qty/8000)), days=Math.ceil(q.qty/(couriers*1200));
  return {f:f,m:m,p:p,d:d,sel:sel,deploy:deploy,print:print,dist:dist,dr:dr,disc:disc,rush:rush,ht:ht,tva:tva,ttc:ht+tva,co2:Math.round(co2),km:Math.round(q.qty*.012),couriers:couriers,days:days};
}

function go(tab,noScroll){
  if(cleanup){cleanup();cleanup=null}

  var t=TABS.filter(function(x){return x.id===tab})[0]||TABS[0];
  $('#title').textContent=t.long; $('#eyebrow').textContent='CDIFFUSION · Aveyron';
  $$('[data-tab]').forEach(function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});

  var v=$('#view'); v.innerHTML=''; ({apercu:vApercu,devis:vDevis,tournee:vTournee,bat:vBat,planning:vPlanning,rse:vRse})[tab](v);

}

  var bars='';MONTHS.forEach(function(m,i){var h=m.co2/mx*ih,x=L+i*bw+bw*.18,w=bw*.64,y=T+ih-h,last=i===MONTHS.length-1;
    bars+='<rect class="bar-r'+(last?' last':'')+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4"/><text class="val" x="'+(x+w/2)+'" y="'+(y-6)+'" text-anchor="middle">'+m.co2+'</text><text x="'+(x+w/2)+'" y="'+(H-10)+'" text-anchor="middle">'+m.m+'</text>'});

var palItems=[],palSel=0,lastFocus=null;
function buildPalette(){
  palItems=TABS.map(function(t){return {l:'Ouvrir : '+t.long,k:t.label,i:t.ic,run:function(){go(t.id)}}}).concat([
    {l:'Télécharger l’estimation de devis',k:'Devis',i:'download',run:function(){saveFile('estimation-cdiffusion.html',quoteDoc())},need:'dl'},
    {l:'Copier le récapitulatif du devis',k:'Devis',i:'copy',run:function(){copyText(quoteText())}},
    {l:'Annoter le dernier BAT',k:'BAT',i:'proof',run:function(){S.bat.ver=LATEST;go('bat')}},
    {l:'Ouvrir le conseil stratégie IA',k:'IA',i:'spark',run:function(){openAi()},need:'ai'},
    {l:'Changer de thème',k:'Affichage',i:'moon',run:cycleTheme},
    {l:'Réinitialiser les données de démonstration',k:'Démo',i:'reset',run:function(){try{localStorage.removeItem(KEY)}catch(e){}var d=defaults();S.quote=d.quote;S.bat=d.bat;S.events=d.events;S.month=null;pickDate=null;go(S.tab);toast('Données de démonstration rétablies')}}
  ]).filter(function(x){return !(x.need==='ai'&&!sample)&&!(x.need==='dl'&&!downloads)});
}
function openPal(){lastFocus=document.activeElement;$('#pal').hidden=false;$('#palIn').value='';palSel=0;renderPal();setTimeout(function(){$('#palIn').focus()},0)}
function closePal(){$('#pal').hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function renderPal(){
  var qv=$('#palIn').value.trim().toLowerCase();
  var list=palItems.filter(function(x){return !qv||(x.l+' '+x.k).toLowerCase().indexOf(qv)>-1});
  palSel=clamp(palSel,0,Math.max(0,list.length-1));
  $('#palList').innerHTML=list.length?list.map(function(x,i){return '<li><button type="button" role="option" data-i="'+i+'" aria-selected="'+(i===palSel)+'">'+ic(x.i)+'<span>'+esc(x.l)+'</span><small>'+esc(x.k)+'</small></button></li>'}).join(''):'<li class="empty" style="margin:8px">Aucune action trouvée.</li>';
  $('#palList').onclick=function(e){var b=e.target.closest('[data-i]');if(b){var it=list[Number(b.dataset.i)];closePal();if(it)it.run()}};
  $('#palIn').onkeydown=function(e){
    if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(list.length-1,palSel+1);renderPal()}
    else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(0,palSel-1);renderPal()}
    else if(e.key==='Enter'){e.preventDefault();var it=list[palSel];closePal();if(it)it.run()}};
}
$('#palIn').addEventListener('input',function(){palSel=0;renderPal()});
$('#pal').addEventListener('mousedown',function(e){if(e.target===this)closePal()});
$('#btnCmd').onclick=openPal;

/* ---------- AI assistant ---------- */
var turns=[],aiCtl=null,busy=false;
var SUGS=['Quelle période pour distribuer à Rodez et Millau ?','Comment présenter ce devis à un client ?','Que mettre dans une attestation RSE crédible ?'];
function aiContext(){var q=S.quote,r=quote(q);return 'Devis en cours : '+(q.client?q.client+', ':'')+r.sel.map(function(c){return c.name}).join(', ')+' ; '+nf.format(q.qty)+' exemplaires ; '+r.f.label+' ; '+r.m.label+' ; papier '+r.p.label+' ; délai '+r.d.label.toLowerCase()+' ; total '+fE(r.ht)+' HT ; CO2 évité estimé '+r.co2+' kg.'}
function openAi(){
  if(!sample)return;lastFocus=document.activeElement;$('#ai').hidden=false;
  if(!$('#chat').children.length){addMsg('a','Bonjour. Je peux vous aider sur le ciblage en Aveyron, la période de distribution, le devis en cours ou l’argumentaire RSE.')}
  $('#sugs').innerHTML=SUGS.map(function(s){return '<button type="button">'+esc(s)+'</button>'}).join('');
  setTimeout(function(){$('#aiIn').focus()},0);
}
function closeAi(){if(aiCtl)aiCtl.abort();$('#ai').hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function addMsg(role,txt){var d=document.createElement('div');d.className='msg '+role;d.textContent=txt;$('#chat').appendChild(d);$('#chat').scrollTop=1e6;return d}
function ask(txt){
  if(!sample||busy||!txt.trim())return;
  busy=true;$('#sugs').innerHTML='';addMsg('u',txt);turns.push({role:'user',content:txt});
  var bub=addMsg('a','Réflexion en cours…');aiCtl=new AbortController();
  var rules='Tu es l’assistant de CDIFFUSION, spécialiste de l’impression et de la distribution éco-responsable (vélo-cargo électrique, papier FSC) en Aveyron : Rodez, Millau, Villefranche-de-Rouergue, Espalion, Decazeville, Saint-Affrique. Réponds en français, de façon synthétique et professionnelle, pour un client B2B. Donne au maximum 3 conseils concrets, en texte brut avec des tirets, sans mise en forme markdown, en moins de 170 mots. Si tu n’es pas sûr d’un fait local ou d’un chiffre, dis-le au lieu d’inventer. Contexte de l’application : '+aiContext();
  var input=[{role:'user',content:rules}].concat(turns.slice(-8));
  $('#aiSend').disabled=true;
  sample(input,{cache:false,modelTier:'quick',signal:aiCtl.signal,onText:function(u){bub.textContent=u.text;$('#chat').scrollTop=1e6}}).then(function(r){turns.push({role:'assistant',content:r.text})},function(e){
    if(e&&e.text){bub.textContent=e.text}else bub.remove();
    if(e&&e.code==='cancelled'){turns.pop();return}
    var m={not_granted:'L’accès à Claude n’a pas été autorisé pour cette page.',rate_limited:'Trop de demandes. Réessayez dans un instant.',sampling_disabled:'L’assistant n’est pas disponible pour ce compte.'}[e&&e.code]||'La réponse a été interrompue. Vous pouvez reposer la question.';
    turns.pop();addMsg('e',m);
  }).then(function(){busy=false;aiCtl=null;$('#aiSend').disabled=false;$('#aiIn').focus()});
}
$('#btnAi').onclick=openAi;$('#aiClose').onclick=closeAi;
$('#ai').addEventListener('mousedown',function(e){if(e.target===this)closeAi()});
$('#aiForm').addEventListener('submit',function(e){e.preventDefault();var v=$('#aiIn').value;$('#aiIn').value='';ask(v)});
$('#aiIn').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#aiForm').requestSubmit?$('#aiForm').requestSubmit():$('#aiForm').dispatchEvent(new Event('submit',{cancelable:true}))}});
$('#sugs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)ask(b.textContent)});

/* ---------- global ---------- */
$('#btnTheme').onclick=cycleTheme;
$('#kbd').textContent=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)?'⌘K':'Ctrl K';
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();$('#pal').hidden?openPal():closePal()}
  else if(e.key==='Escape'){if(!$('#pal').hidden)closePal();else if(!$('#ai').hidden)closeAi()}
});
buildNav();buildPalette();applyTheme();
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
var h0=(location.hash||'').slice(1);
go(TABS.some(function(t){return t.id===h0})?h0:'apercu',true);
})();
</script>
